name: CI

on: [ push, pull_request, workflow_dispatch ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        smalltalk: [ Pharo64-14, Pharo64-13, Pharo64-12, Pharo64-alpha ]
    name: ${{ matrix.smalltalk }}
    # the development version may break for reasons outside ZTimestamp
    continue-on-error: ${{ matrix.smalltalk == 'Pharo64-alpha' }}
    steps:
      - uses: actions/checkout@v5
      - uses: hpi-swa/setup-smalltalkCI@v1
        with:
          smalltalk-image: ${{ matrix.smalltalk }}
      - run: smalltalkci -s ${{ matrix.smalltalk }}
        shell: bash
        timeout-minutes: 15
